name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# A new push to a PR makes the previous run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  extension:
    # Runs unconditionally rather than behind a paths filter: a required check that gets
    # skipped blocks merges rather than passing them.
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -p . --noEmit

      - name: Test
        run: npm test

      - name: Package
        run: npx --yes @vscode/vsce package --out /tmp/extension.vsix

  test:
    # The selling point of this tool is one binary that runs anywhere, so the matrix is
    # load-bearing rather than ceremony: it is the claim under test.
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-features

  features:
    # Every language is feature-gated, so the registry has to keep compiling with any subset —
    # including none, which must still produce a binary rather than a type error.
    name: Feature combinations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["php", "ts", "php,ts", ""]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build with features "${{ matrix.features }}"
        run: cargo build -p bonsai-lint --no-default-features --features "${{ matrix.features }}"

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # Build only: the lint config targets current stable, so clippy on an old toolchain would
      # fail on lints that did not exist yet.
      - name: Build
        run: cargo build --all-features
