name: Annotation demo

# Temporary: shows `--format github` on this pull request's own demo files. Remove before merging.
on:
  pull_request:

permissions:
  contents: read

jobs:
  annotate:
    name: GitHub annotations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build -p bonsai-lint

      # From a subdirectory, so the paths have to be rebased on the checkout to land.
      - name: Breaches, a baseline and warnings
        working-directory: demo/annotations
        run: ../../target/debug/bonsai-lint --format github .
        continue-on-error: true

      - name: Eleven breaches, one past the cap
        run: target/debug/bonsai-lint --format github demo/annotations-cap
        continue-on-error: true
