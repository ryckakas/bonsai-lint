name: Publish to Open VSX

# The extension is versioned on its own, so it publishes whatever editors/vscode/package.json says
# when dispatched by hand. Open VSX trusts this file at any ref, so the openvsx environment, which
# admits only main, is what keeps a branch from publishing. A version on Open VSX is permanent.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: ovsx publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: openvsx
      url: https://open-vsx.org/extension/RicardasKauneckas/bonsai-lint
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache: a publish should not restore what another workflow wrote.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # --trusted-publishing fails rather than falling back when GitHub hands out no ID token.
      - name: Publish
        run: npx --yes ovsx@1.2.0 publish --trusted-publishing
