name: Publish the Go module

# Called by release.yml once the GitHub Release exists. Dispatched by hand, it reruns a failed
# publish or rehearses one. A published Go version is permanent, so a tag is never moved.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to publish, e.g. v0.3.0"
        required: true
        type: string
      rehearsal:
        description: "Push to the rehearsal branch of bonsai-lint-go instead: no tag, no proxy"
        type: boolean
        default: true
      saved_manifest:
        description: "Rehearsals only: a dist-manifest.json in bonsai-lint-go to use instead"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    name: Tag bonsai-lint-go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN: ${{ inputs.plan }}
      INPUT_TAG: ${{ inputs.tag }}
      REHEARSAL: ${{ inputs.rehearsal == true }}
      SAVED_MANIFEST: ${{ inputs.saved_manifest }}
    steps:
      - name: Resolve the release
        run: |
          tag="${INPUT_TAG:-$(jq -r .announcement_tag <<<"$PLAN")}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a release tag; prereleases are not published to Go"
            exit 1
          fi
          if [ -n "$SAVED_MANIFEST" ] && [ "$REHEARSAL" != true ]; then
            echo "::error::saved_manifest is for rehearsals only"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: ryckakas/bonsai-lint-go
          token: ${{ secrets.GO_MODULE_TOKEN }}
          path: go-module

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # The plan dist passes in is written before the build, so it has no checksums yet.
      - name: Fetch the released manifest
        run: |
          if [ -n "$SAVED_MANIFEST" ]; then
            cp "go-module/$SAVED_MANIFEST" dist-manifest.json
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern dist-manifest.json
          fi
          released="$(jq -r .announcement_tag dist-manifest.json)"
          if [ "$released" != "$TAG" ]; then
            echo "::error::the manifest is for $released, not $TAG"
            exit 1
          fi

      - name: Generate release.go and test the launcher
        working-directory: go-module
        run: |
          go run ./internal/generate -manifest ../dist-manifest.json
          go vet ./...
          go test ./...
          git diff --stat

      - name: Tag the release
        working-directory: go-module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add release.go
          if [ "$REHEARSAL" = true ]; then
            git commit --quiet -m "release $TAG (rehearsal)"
            git push --force origin HEAD:refs/heads/rehearsal
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            if git diff --quiet "$TAG" -- release.go; then
              echo "$TAG is already published with this release.go"
              exit 0
            fi
            echo "::error::$TAG already exists in bonsai-lint-go with a different release.go"
            exit 1
          fi
          # Only the tag reaches the remote: main keeps the placeholder release.go.
          git commit --quiet -m "release $TAG"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      # The proxy fetches a version on its first request: make that now, not at a user's install.
      - name: Ask the Go proxy for it
        if: env.REHEARSAL != 'true'
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS "https://proxy.golang.org/bonsai.kauneckas.dev/bonsai-lint/@v/$TAG.info" && exit 0
            echo "attempt $attempt: the proxy does not have $TAG yet"
            sleep 20
          done
          exit 1
