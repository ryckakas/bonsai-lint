name: Publish to crates.io

# Deliberately a separate workflow: release.yml is generated by dist and must not be
# hand-edited, and dist has no crates.io publish job. Kept on manual dispatch rather than
# a tag trigger because cargo publish cannot be undone — a version, once taken, is taken
# even if the publish later fails — and the operation is not atomic across a workspace.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish, e.g. v0.2.1"
        required: true
        type: string
      dry_run:
        description: "Verify only, publish nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # Multi-package publishing needs 1.90 or newer, which is also the workspace MSRV.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --workspace resolves the publish order from the dependency graph and verifies every
      # crate against the others as if they were already on the registry. --locked makes a
      # lockfile that disagrees with Cargo.toml a hard failure rather than a silent rewrite.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked ${{ inputs.dry_run && '--dry-run' || '' }}
