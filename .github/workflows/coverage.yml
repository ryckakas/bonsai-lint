name: Coverage

# Reports the workspace's test coverage on each pull request, in one comment that every run
# rewrites. It is a report, not a gate: a percentage alone is no reason to add a test.
on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component llvm-tools-preview
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov

      - name: Test with coverage
        run: cargo llvm-cov --workspace --all-features --json --summary-only --output-path coverage.json

      - name: Write the comment
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - > coverage-comment.md <<'EOF'
          import json, os, re
          from collections import defaultdict

          data = json.load(open("coverage.json"))["data"][0]
          kinds = ("lines", "regions", "functions")
          crates = defaultdict(lambda: {kind: [0, 0] for kind in kinds})
          for entry in data["files"]:
              crate = re.search(r"/crates/([^/]+)/", entry["filename"]).group(1)
              for kind in kinds:
                  crates[crate][kind][0] += entry["summary"][kind]["covered"]
                  crates[crate][kind][1] += entry["summary"][kind]["count"]

          def pct(covered, count):
              return f"{100 * covered / count:.1f}%" if count else "–"

          totals = {kind: (data["totals"][kind]["covered"], data["totals"][kind]["count"]) for kind in kinds}
          rows = [
              f"| {name} | {pct(*c['lines'])} ({c['lines'][0]}/{c['lines'][1]}) | {pct(*c['regions'])} | {pct(*c['functions'])} |"
              for name, c in sorted(crates.items())
          ]
          print("\n".join([
              "### Rust test coverage",
              "",
              f"At `{os.environ['HEAD_SHA'][:7]}`: **{pct(*totals['lines'])}** of lines, {pct(*totals['regions'])} of regions "
              f"and {pct(*totals['functions'])} of functions. Doc tests and the separate wasm workspace are not counted.",
              "",
              "| Crate | Lines | Regions | Functions |",
              "|---|---:|---:|---:|",
              *rows,
          ]))
          EOF
          cat coverage-comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-comment
          path: coverage-comment.md
          retention-days: 1

  # Its own job, so the token that can comment never shares a runner with the pull request's code.
  # A fork's pull request gets no comment; its numbers are in the other job's summary.
  comment:
    name: Coverage comment
    needs: coverage
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Listing a pull request's comments needs both scopes, and editing one needs both at write.
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-comment

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- bonsai-lint-coverage -->'
            const body = `${marker}\n${fs.readFileSync('coverage-comment.md', 'utf8').trim()}\n`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
