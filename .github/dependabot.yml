version: 2

# The grammar contract tests exist precisely to catch a tree-sitter upgrade renaming a node out
# from under the kind tables, so dependency PRs are where they earn their keep.
#
# Cooldown holds a release for three days before proposing it, which is long enough for a bad
# publish to be yanked before it costs a CI run. With no `include` list it applies to every
# dependency, and with no semver-specific overrides it applies to major, minor and patch alike.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3

  # The extension's devDependencies only — the CLI it drives is the Rust binary above.
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: monthly
    cooldown:
      default-days: 3

  # Covers ci.yml. release.yml is generated by `dist`, so a bump there is reverted by the next
  # `dist generate` — regenerate rather than merging that half of a pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
