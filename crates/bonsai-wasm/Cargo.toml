# Deliberately its own workspace, not a member of the one above.
#
# Building for wasm32 needs patched `tree-sitter-*` grammar crates (their build scripts have
# no wasm32 branch). A `[patch.crates-io]` only takes effect at a workspace root, and applying
# it to the main workspace would rebuild the shipped CLI against forked grammars. Isolating it
# here keeps the native build byte-identical to what it was.
[workspace]

[package]
name = "bonsai-wasm"
description = "WebAssembly bindings for the bonsai-lint scorer, for the docs-site playground"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bonsai-core = { path = "../bonsai-core" }
bonsai-lang-php = { path = "../bonsai-lang-php" }
bonsai-lang-ts = { path = "../bonsai-lang-ts" }
bonsai-lang-vue = { path = "../bonsai-lang-vue" }
tree-sitter = "0.27"

# Populated by ./vendor-grammars.py, which copies the published crates and adds the wasm32
# branch their build scripts are missing. Both patches are upstreamable and meant to be
# temporary; when they land, these become plain version requirements again.
[patch.crates-io]
tree-sitter-php = { path = "vendor/tree-sitter-php" }
tree-sitter-typescript = { path = "vendor/tree-sitter-typescript" }
tree-sitter-html = { path = "vendor/tree-sitter-html" }

# The workspace above sets `unsafe_code = "forbid"`. Any wasm boundary needs unsafe somewhere:
# a raw C ABI needs `slice::from_raw_parts`, and wasm-bindgen generates unsafe of its own. The
# unsafe here is confined to the three FFI entry points and nothing else in the crate.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
