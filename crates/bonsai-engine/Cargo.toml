[package]
name = "bonsai-engine"
description = "Scan driver, configuration and baselines for bonsai-lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["complexity", "linter", "static-analysis", "baseline", "tree-sitter"]
categories = ["development-tools"]

[features]
default = ["php", "ts", "vue", "go", "java", "python"]
go = ["dep:bonsai-lang-go"]
java = ["dep:bonsai-lang-java"]
php = ["dep:bonsai-lang-php"]
python = ["dep:bonsai-lang-python"]
ts = ["dep:bonsai-lang-ts"]
# Vue reuses the TypeScript spec, so it cannot be built without it.
vue = ["ts", "dep:bonsai-lang-vue"]

[dependencies]
bonsai-core = { workspace = true }
bonsai-lang-go = { workspace = true, optional = true }
bonsai-lang-java = { workspace = true, optional = true }
bonsai-lang-php = { workspace = true, optional = true }
bonsai-lang-python = { workspace = true, optional = true }
bonsai-lang-ts = { workspace = true, optional = true }
bonsai-lang-vue = { workspace = true, optional = true }
tree-sitter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
