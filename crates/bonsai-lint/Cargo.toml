[package]
name = "bonsai-lint"
description = "Cognitive complexity linter for PHP, JavaScript, TypeScript, Vue and Go, as a single static binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["linter", "complexity", "php", "typescript", "go"]
categories = ["development-tools"]

[[bin]]
name = "bonsai-lint"
path = "src/main.rs"

[features]
default = ["php", "ts", "vue", "go"]
go = ["bonsai-engine/go"]
php = ["bonsai-engine/php"]
ts = ["bonsai-engine/ts"]
vue = ["bonsai-engine/vue"]

[dependencies]
bonsai-core = { workspace = true }
bonsai-engine = { workspace = true, default-features = false }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# Duplicated from the workspace root on purpose. A published crate is its own root, so this is
# the only copy `cargo install` ever sees; without it Cargo users get an unoptimised, unstripped
# 7.6 MB binary instead of 6.1 MB. Cargo ignores it during a workspace build and says so.
[profile.release]
lto = true
codegen-units = 1
strip = true
