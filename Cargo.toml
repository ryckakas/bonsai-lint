[workspace]
resolver = "2"
members = [
    "crates/bonsai-core",
    "crates/bonsai-lang-go",
    "crates/bonsai-lang-java",
    "crates/bonsai-lang-php",
    "crates/bonsai-lang-python",
    "crates/bonsai-lang-ts",
    "crates/bonsai-lang-vue",
    "crates/bonsai-engine",
    "crates/bonsai-lint",
    "crates/bonsai-testkit",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ryckakas/bonsai-lint"
homepage = "https://github.com/ryckakas/bonsai-lint"

[workspace.dependencies]
bonsai-core = { path = "crates/bonsai-core", version = "0.4.1" }
bonsai-lang-go = { path = "crates/bonsai-lang-go", version = "0.4.1" }
bonsai-lang-java = { path = "crates/bonsai-lang-java", version = "0.4.1" }
bonsai-lang-php = { path = "crates/bonsai-lang-php", version = "0.4.1" }
bonsai-lang-python = { path = "crates/bonsai-lang-python", version = "0.4.1" }
bonsai-lang-ts = { path = "crates/bonsai-lang-ts", version = "0.4.1" }
bonsai-lang-vue = { path = "crates/bonsai-lang-vue", version = "0.4.1" }
bonsai-engine = { path = "crates/bonsai-engine", version = "0.4.1", default-features = false }
bonsai-testkit = { path = "crates/bonsai-testkit", version = "0.4.1" }
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-html = "0.23"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
globset = "0.4"
tempfile = "3"
mimalloc = { version = "0.1.52", features = ["override"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
excessive_nesting = "deny"
too_many_lines = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# From `restriction`, which is a menu rather than a group to enable. `print_stdout` guards the
# closed-stdout rule, since `println!` panics on a closed pipe; `exit` would skip destructors.
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
exit = "warn"
format_push_string = "warn"
get_unwrap = "warn"
infinite_loop = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
panic_in_result_fn = "warn"
print_stdout = "warn"
rest_pat_in_fully_bound_structs = "warn"
todo = "warn"
try_err = "warn"
unimplemented = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
verbose_file_reads = "warn"
# From `nursery`, whose lints are too unsettled to take as a group.
needless_collect = "warn"
or_fun_call = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
